[project]
name = "qa"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = [
    "pydantic-settings>=2.16.2",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-playwright>=0.10.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--import-mode=importlib", "-ra"]
# strict = markers, config keys, parametrization ids and xfail
strict = true
markers = [
    "smoke: fast checks run on every PR",
    "regression: full regression suite",
]

[tool.mypy]
strict = true
files = ["framework", "tests", "conftest.py"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", # conflicts with the formatter
    "CPY001", # no copyright headers, the license is in the repository root
    "ISC001", # conflicts with the formatter
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "pydantic_settings.BaseSettings",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "D",       # test names are the documentation
    "INP001",  # tests are not a package (importlib import mode)
    "PLR2004", # magic values are fine in assertions
    "S101",    # assert is how pytest tests are written
]
